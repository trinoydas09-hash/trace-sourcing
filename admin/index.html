<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>TRACE SOURCING Admin</title>
<style>
:root{--navy:#022b46;--n2:#0b4268;--sand:#c9a96a;--bg:#f3f6f9;--line:#dbe3ea;--ink:#0f1f2c;--mut:#5a6b79}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}.b,button.b{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border:0;border-radius:4px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}.b.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}.b.d{background:#b3261e}.b.s{min-height:32px;padding:0 10px;font-size:13px}
input,select,textarea{font:inherit;min-height:40px;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:#fff;width:100%}textarea{min-height:80px}label{display:grid;gap:4px;font-weight:600;font-size:13px}label.c{display:flex;align-items:center;gap:8px}label.c input{width:auto;min-height:0}
.lg{min-height:100vh;display:grid;place-items:center;background:var(--navy);padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px}.lg .card{width:min(380px,100%);display:grid;gap:12px}.lg h1{margin:0;font:700 24px Georgia,serif}.lg small{display:block;color:var(--mut);font:13px sans-serif}.err{color:#b3261e}.mut{color:var(--mut)}
.sh{display:grid;grid-template-columns:220px 1fr;min-height:100vh}#sd{background:var(--navy);color:#fff;padding:16px;display:flex;flex-direction:column;gap:2px}#sd h2{font:700 22px Georgia,serif;margin:0 0 12px}#sd h2 small{display:block;font:12px sans-serif;color:var(--sand)}
#sd a,#sd button{color:#fff;text-decoration:none;padding:10px;border-radius:4px;background:none;border:0;text-align:left;font:inherit;cursor:pointer}#sd a.on,#sd a:hover{background:var(--n2)}.mn header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center}.bg{display:none;background:none;border:0;font-size:22px}
main{padding:16px;max-width:1300px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.cards .card b{display:block;font-size:26px}.cards small{color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar input,.bar select{width:auto;min-width:130px}.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{background:#f7f9fb;font-size:12px;text-transform:uppercase;color:var(--mut)}
.th{width:44px;height:44px;object-fit:cover;border-radius:4px;background:#e6eef5;display:block}.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#e6eef5;font-size:12px;margin:1px}.pill.g{background:#d9f1e1}.pill.r{background:#f8d9d6}.pill.y{background:#f6ecd0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.f .full{grid-column:1/-1}fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 12px;padding:12px;background:#fff}legend{font-weight:700;padding:0 6px}
#ims{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.im{width:130px;border:1px solid var(--line);border-radius:6px;padding:6px;position:relative;background:#fff}.im img{width:100%;height:110px;object-fit:cover;border-radius:4px}.im b{position:absolute;top:10px;left:10px;background:var(--sand);padding:0 6px;border-radius:3px;font-size:11px}.im div{display:flex;gap:2px;margin-top:4px}.im button{flex:1;min-height:30px;border:1px solid var(--line);background:#fff;cursor:pointer}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:12px}.md{background:#fff;border-radius:8px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}#toast{position:fixed;right:16px;bottom:16px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:4px;display:none;z-index:99}#toast.bad{background:#b3261e}
@media(max-width:800px){.sh{grid-template-columns:1fr}#sd{position:fixed;inset:0 auto 0 0;width:240px;transform:translateX(-100%);transition:.25s;z-index:40}#sd.open{transform:none}.bg{display:block}}
</style></head><body><div id="app"><p style="padding:20px">Loading…</p></div><div id="toast"></div>
<script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="../js/services.js"></script><script src="admin.js"></script></body></html>
